# MGin 应用配置示例（jh 分支）
# 复制本文件为 application.yml 并按需修改即可运行。
# 本示例重点演示三大新增能力的配置：ratelimit（限流）/ job（定时任务）/ s3（对象存储）。

go:
  application:
    name: myapp
    port: 8080
    project: myproj
    port_ssl: 8443
    debug: true
    ip: 127.0.0.1
    # 优雅关闭超时时间（秒）。退出时逐个 Shutdown 已启动的 HTTP / HTTPS server，
    # 未配置或 <= 0 时回退为 5 秒（与升级前硬编码值一致，老项目不受影响）
    shutdownTimeout: 10
  logger:
    level: debug
    out: console,file
    file: /opt/logs/myapp
  config:
    # 启用的组件，逗号分隔。下列组件按需增删：
    #   sqlite  —— 定时任务(job)需要至少一个数据库；此处用 sqlite 演示
    #   ratelimit / job / s3 —— 本次新增的三大能力开关
    used: "sqlite,ratelimit,job,s3"
    env: test
    prefix:
      sqlite: mytest.db
      # 新增能力为“内联配置”，无需单独的 <prefix>-<env>.yml 文件
      ratelimit: "go.ratelimit"
      job: "go.job"
      s3: "go.s3"

  # ------------------------------------------------------------------
  # 接口日志中 GET 响应输出：full 完整输出，line 控制台/文件最多 120 字符，off 不输出也不保存响应
  # ------------------------------------------------------------------
  log:
    get: full

  # ------------------------------------------------------------------
  # 1) 单例限流中间件（middleware/ratelimit）
  # ------------------------------------------------------------------
  ratelimit:
    enabled: true
    idleTimeout: 600          # 空闲限流器回收间隔（秒）
    whitelist:                # 前缀路径白名单，匹配即放行
      - "/health"
      - "/actuator"
    whiteIps:                 # IP 白名单
      - "127.0.0.1"
    rules:
      - name: "全局令牌桶"
        algorithm: "token_bucket"   # token_bucket | sliding_window | concurrency
        dimension: "global"         # global | ip | path | ip_path | header
        rate: 100                    # 令牌桶：每秒补充令牌；滑动窗口：窗口内允许次数
        burst: 20                    # 令牌桶突发容量（仅 token_bucket）
        httpStatus: 429             # 触发限流时的 HTTP 状态码
        code: 1011                   # 业务错误码
        message: "请求过于频繁，请稍后再试"
      - name: "登录按 IP 限流"
        path: "/api/login/*"        # 精确 / 前缀"/*" / Gin 路由模板
        methods: ["POST"]
        algorithm: "sliding_window"
        dimension: "ip"
        rate: 5                      # 每个 IP 在 window 秒内最多 rate 次
        window: 60
        httpStatus: 429
        code: 1011
        message: "登录尝试过于频繁"
      - name: "上传并发控制"
        path: "/api/upload"
        algorithm: "concurrency"
        dimension: "global"
        maxConcurrent: 10           # 同时最多 10 个上传进行中

  # ------------------------------------------------------------------
  # 2) 定时任务管理器（job，类 xxl-job）
  #    依赖一个数据库；本例用 sqlite，生产可换 mysql / postgres
  # ------------------------------------------------------------------
  job:
    enabled: true
    dbName: ""              # 多库模式指定库名；单库留空
    initdb: true            # 自动建表 mgin_job_info / mgin_job_log
    tablePrefix: "mgin_"
    scanInterval: 1         # 调度扫描间隔（秒）
    refreshInterval: 30     # 从数据库同步任务配置间隔（秒）
    logRetainDays: 30       # 执行日志保留天数，0 不清理
    maxConcurrent: 50       # 全局最大并发执行数
    maxSerialQueue: 10      # serial 阻塞策略最大排队数
    timezone: "Asia/Shanghai"

  # ------------------------------------------------------------------
  # 3) S3 对象存储插件（storage/s3，基于 aws-sdk-go-v2）
  #    endpoint 填 AWS S3 或 MinIO 等兼容服务的地址
  # ------------------------------------------------------------------
  s3:
    enabled: true
    endpoint: "https://s3.amazonaws.com"   # MinIO 示例: http://localhost:9000
    region: "cn-north-1"
    accessKey: "AKIDEXAMPLE"
    secretKey: "YOUR_SECRET_KEY"
    # sessionToken: ""                   # 使用临时凭证时填写
    pathStyle: true                      # MinIO / 自建服务必须为 true；AWS S3 可 false
    ssl: true
    maxRetries: 3
    uploadPartSize: 16777216             # 分片上传单片大小（字节）
    downloadPartSize: 16777216
    maxUploadParts: 10
    maxDownloadParts: 10
    presignExpiry: 3600                  # 预签名 URL 有效期（秒）
    singleBucket: "my-bucket"            # 单桶模式（不配置 buckets 时使用）
    buckets:                             # 多桶模式（与 singleBucket 二选一）
      - name: "public-assets"
        public: true
        defaultContentType: "image/png"
      - name: "private-files"
        public: false

  # 定时任务执行器与 S3 桶的取用均在代码中完成，例如：
  #   job.Register("demoJob", func(ctx *job.Context) error { ... })
  #   b := s3.GetS3().Default()
  # 管理接口挂载（Gin 路由组）：
  #   job.RouterGroup(app.Router.Group("/job"))

  # ------------------------------------------------------------------
  # 4) 健康检查探针（health 包，K8s liveness / readiness / startup）
  #    默认关闭；enabled=true 时框架在主引擎上最先挂载（早于所有中间件），
  #    因此不会被 casbin / jwt 等鉴权中间件拦截，探活不会返回 401。
  #    端点: GET /health/live   GET /health/ready   GET /health/startup
  #    响应: {"status":"ok","dependencies":{"mysql":"ok","redis":"fail"}}
  # ------------------------------------------------------------------
  health:
    enabled: false
    # autoStarted: true 时框架在监听启动后自动调用 health.MarkStarted()，
    # 使 /startup 立即返回 200；默认 false，由业务初始化完成后自行调用 health.MarkStarted()
    autoStarted: false

  # ------------------------------------------------------------------
  # 5) v2 框架元配置（go.framework.*）
  #    描述"框架行为开关"，与 go.application.*（业务配置）解耦。
  #    全部字段为可选，未配置时由各组件按合理默认回退。
  #    老项目无需关心本节，框架不读时所有开关保持关闭。
  # ------------------------------------------------------------------
  framework:
    # 是否在 NewApp 阶段默认挂载 /health/live /health/ready /health/startup 探针。
    # 业务也可调用 App.EnableHealth() 在代码中显式启用。
    healthEnabled: false
    # 是否启用 xlang 国际化中间件（NewApp 的 xlang 参数也可控制）。
    i18nEnabled: false
    # 是否启用单例限流中间件（middleware/ratelimit）。
    ratelimitEnabled: false
    # 是否启用 panic 恢复中间件（gin-nice-recovery）。
    recoverEnabled: true
    # 是否启用接口日志（middleware/postlog）。
    logRequests: true

  # ------------------------------------------------------------------
  # 6) v2 运行时元数据（go.runtime.*）
  #    这些字段**不**从 application.yml 读取，由构建脚本通过 -ldflags 注入：
  #      go build -ldflags "-X main.CommitHash=$(git rev-parse --short HEAD) \
  #                        -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  #    业务可通过 Config.Runtime 在 /health/ready 响应、metrics label、日志上下文等位置引用。
  #    以下示例仅作字段名参考，不会被配置加载。
  # ------------------------------------------------------------------
  # runtime:
  #   commitHash: "a1b2c3d"
  #   buildTime: "2026-09-04T12:00:00Z"
  #   goVersion: "go1.25.7"
  #   startedAt: <框架在 NewApp 时填入>
  #   pid: <框架在 NewApp 时填入>

# ------------------------------------------------------------------
# 5) Prometheus 指标（pkg/metrics，v2.1 新增）
#    启用后框架在主引擎上最先挂载（早于所有中间件），因此不会被 casbin / jwt
#    等鉴权中间件拦截，Prometheus 抓取不会返回 401。
#    端点: GET /metrics
#    关键指标:
#      mgin_http_requests_total{method,path,status}
#      mgin_http_request_duration_seconds{method,path}
#      mgin_http_requests_in_flight
#      mgin_build_info{version,commit,go_version}
#      mgin_plugin_health{name}
#      mgin_dependency_up{name}
# ------------------------------------------------------------------
metrics:
  enabled: false
  # 业务可主动调用 mgin.App.EnableMetrics() 显式启用，行为与 enabled=true 一致。

# ------------------------------------------------------------------
# 6) OpenTelemetry（pkg/otel，v2.1 新增）
#    v2 决定走"轻量接口 + 业务自接 SDK"路线，框架不强制引入 OTel SDK/exporter。
#    业务启用方式：
#      1) go get go.opentelemetry.io/otel/sdk + exporter
#      2) import "github.com/maczh/mgin/pkg/otel"
#      3) otel.SetTracerProvider(自行构造的 sdktrace.TracerProvider)
#    框架已自动给 trace header 加上 W3C traceparent，可与 OTel SDK 无缝对接。
# ------------------------------------------------------------------
otel:
  enabled: false
  # endpoint: "http://localhost:4318"  # OTLP HTTP 端点；为空时业务自行选择 exporter
