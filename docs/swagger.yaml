paths:
  /api/v1/captcha/get:
    get:
      consumes:
      - application/json
      description: 获取图片验证码，返回验证码 ID 和 Base64 编码的图片
      parameters:
      - in: query
        name: height
        required: true
        type: integer
      - in: query
        name: length
        type: integer
      - description: 0:数字 1:字母 2:算术
        in: query
        name: type
        type: integer
      - in: query
        name: width
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回验证码信息
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或获取验证码失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 获取验证码
      tags:
      - 验证码
  /api/v1/captcha/verify:
    post:
      consumes:
      - application/json
      description: 验证用户输入的验证码是否正确
      parameters:
      - description: 验证验证码请求参数
        in: body
        name: verifyReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.VerifyCaptchaReq'
      produces:
      - application/json
      responses:
        "200":
          description: 验证码验证成功
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或验证码错误
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 验证验证码
      tags:
      - 验证码
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 已注册用户进行登录操作
      parameters:
      - description: 用户登录请求参数
        in: body
        name: loginReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回 token
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 请求参数错误或登录失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 用户登录
      tags:
      - 用户管理
  /api/v1/register:
    post:
      consumes:
      - application/json
      description: 新用户进行注册操作
      parameters:
      - description: 用户注册请求参数
        in: body
        name: registerReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功，返回用户信息
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 请求参数错误或注册失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 用户注册
      tags:
      - 用户管理
  /api/v1/role_api/bind:
    post:
      consumes:
      - application/json
      description: 将指定角色与 API 进行绑定操作,先全量解绑再批量绑定
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 角色与 API 绑定请求参数
        in: body
        name: bindReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.BindRoleApiReq'
      produces:
      - application/json
      responses:
        "200":
          description: 绑定成功
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或绑定操作失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 绑定角色和API
      tags:
      - 角色API绑定
  /api/v1/role_api/list:
    post:
      consumes:
      - application/json
      description: 根据请求参数获取指定角色关联的 API 列表
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 获取角色 API 列表请求参数
        in: body
        name: listReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.ListRoleApiReq'
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功，返回角色关联的 API 列表
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或获取 API 列表失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 获取角色的API列表
      tags:
      - 角色API绑定
  /api/v1/role_menu/bind:
    post:
      consumes:
      - application/json
      description: 将指定角色与菜单进行绑定操作
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 角色菜单绑定请求参数
        in: body
        name: bindReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.BindRoleMenuReq'
      produces:
      - application/json
      responses:
        "200":
          description: 绑定成功
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或绑定操作失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 绑定角色和菜单
      tags:
      - 角色菜单管理
  /api/v1/role_menu/list:
    post:
      consumes:
      - application/json
      description: 根据请求参数获取指定角色关联的菜单列表
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 获取角色菜单列表请求参数
        in: body
        name: listReq
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.ListRoleMenuReq'
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功，返回角色关联的菜单列表
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
          description: 参数绑定失败或获取菜单列表失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 获取角色的菜单列表
      tags:
      - 角色菜单管理
  /api/v1/sys/dept/add:
    post:
      consumes:
      - application/json
      description: 创建一个新的部门信息
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 部门创建请求参数
        in: body
        name: dept
        required: true
        schema:
          $ref: '#/definitions/github_com_maczh_mgin_models_sys_request.CreateDeptReq'
      produces:
      - application/json
      responses:
        "200":
          description: 新增成功，返回新增的部门信息
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-github_com_maczh_mgin_models_sys_SysDept'
        "500":
          description: 参数绑定失败或新增部门失败
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
      summary: 新增部门
      tags:
      - 系统部门
  /api/v1/sys/dept/del:
    post:
      consumes:
      - application/json
      description: 根据部门 ID 删除指定部门，软删除
      parameters:
      - description: 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/github_com_maczh_mgin_models.Result-any'
        "500":
